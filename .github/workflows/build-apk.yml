name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "::warning::No KEYSTORE_BASE64 secret. The APK is signed with a temporary debug key."
          fi

      - name: Build the APK and app bundle
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Name the files
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk senanothi.apk
          cp android/app/build/outputs/bundle/release/app-release.aab senanothi.aab

      - uses: actions/upload-artifact@v4
        with:
          name: senanothi-android
          path: |
            senanothi.apk
            senanothi.aab

      - name: Publish a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: সেনানথি for Android (build ${{ github.run_number }})
          body: |
            Download **senanothi.apk** below and open it on an Android phone.
            If asked, allow your browser or Files app to install unknown apps.
            The app opens https://mahmud629.github.io/Shena-nothi/ and needs Google Chrome on the phone.
          files: |
            senanothi.apk
            senanothi.aab
          make_latest: true
